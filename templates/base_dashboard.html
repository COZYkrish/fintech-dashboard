<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FinDash</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Core Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

<div class="dashboard-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h2>FinDash</h2>

        <nav>
            <ul>
                {% if current_user.role == 'admin' %}
                    <li><a href="/admin/dashboard">Loan Applications</a></li>
                    <li><a href="/admin/analytics">Analytics</a></li>
                {% else %}
                    <li><a href="/user/dashboard">My Loans</a></li>
                {% endif %}
                <li style="margin-top: 2rem;"><a href="/auth/logout">Logout</a></li>
            </ul>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

</div>
<div id="toast"></div>
</body>
</html>
